<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- The nav Logomark. It is drawn for the site's dark background and its outline is
       near-white, so as a tab icon it carries that background with it — otherwise the
       flask disappears against a light tab bar. Strokes are scaled up to keep the same
       visual weight they have in the nav once the mark is shrunk into 32px. -->
  <rect width="32" height="32" rx="7" fill="#05070d" />
  <g transform="translate(16 16) scale(.78) translate(-15 -17)">
    <path
      d="M11 3h8M12 3v7l-6 15a2.5 2.5 0 0 0 2.4 3.5h13.2A2.5 2.5 0 0 0 24 25l-6-15V3z"
      fill="#0b0f18"
      stroke="#f5f7fb"
      stroke-width="2"
    />
    <path d="M8.5 21.5 Q15 18 22.5 21.5 L24.6 26.5 A2.5 2.5 0 0 1 22 28.5 H9 A2.5 2.5 0 0 1 6.6 26.5 Z" fill="#79E59B" />
    <path d="M9.5 24.5 Q15 22 21.5 24.5 L22.8 27.5 A2 2 0 0 1 21 28.5 H10 A2 2 0 0 1 8.4 27.5 Z" fill="#F64C6F" />
    <path
      d="M13 12l-1.6 2 1.6 2M17 12l1.6 2-1.6 2"
      stroke="#79E59B"
      stroke-width="1.6"
      fill="none"
      stroke-linecap="round"
      stroke-linejoin="round"
    />
  </g>
</svg>
