services:
  web:
    build: .
    command: >-
      sh -c "yarn install --frozen-lockfile &&
      yarn dev --hostname 0.0.0.0 --port 3000"
    ports:
      - "3000:3000"
    env_file:
      - .env
    environment:
      API_BASE_URL: http://platform-api:8000
      NEXT_PUBLIC_SOCKET_URL: http://localhost:8002
      WATCHPACK_POLLING: "true"
      CHOKIDAR_USEPOLLING: "true"
    volumes:
      - .:/app
      - frontend_node_modules:/app/node_modules
      - frontend_next:/app/.next
    networks:
      default:
      devbutter_shared:
        aliases:
          - frontend

networks:
  default:
  devbutter_shared:
    external: true

volumes:
  frontend_node_modules:
  frontend_next:
